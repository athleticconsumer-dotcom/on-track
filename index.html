<style id="css">
:root{
  --bg:#0f1222;--card:#181c33;--ink:#eef0fa;--muted:#9aa0bd;--faint:#4a5075;--line:#262b47;--soft:#1f2440;
  --lang:#4fb7a6;--lang-soft:#173430;--sport:#ef8358;--sport-soft:#3a2219;--deen:#a3acf5;--deen-soft:#23284a;
  --warn:#f7c948;--warn-soft:#2e2715;
  --radius:16px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:0}
.status{font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);white-space:nowrap}
.status.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.daynav h2{margin:0;font-size:18px;font-weight:700;flex:1;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:11px;font-size:18px;line-height:1;display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.hero{display:flex;align-items:center;gap:18px}
.hero .txt{flex:1}
.hero .big{font-size:15px;font-weight:700;margin:0 0 4px}
.hero .sub{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}
.ring{flex:none}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;line-height:1.45}
.alert b{color:var(--warn)}
.area-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:22px 4px 8px;color:var(--muted)}
.area-h i{width:8px;height:8px;border-radius:50%;display:inline-block}
.goal-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:12px 2px 6px;display:flex;justify-content:space-between}
.goal-h:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;padding:10px 6px;border-radius:12px;min-height:50px}
button.row:hover{background:var(--soft)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;transition:.15s}
.chk svg{opacity:0;transition:.15s}
.on .chk{background:var(--c);border-color:var(--c)}
.on .chk svg{opacity:1}
.rname{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.on .rname{color:var(--muted)}
.rmeta{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.streak{font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
.mrow{flex-wrap:wrap}
.mrow .rname{min-width:140px}
.stepper button[aria-label*="5"]{width:auto;padding:0 9px;font-size:13px}
.timer{border:0;background:var(--c);color:#fff;border-radius:10px;padding:0 12px;height:32px;font-weight:700;font-size:13px;min-width:78px;font-variant-numeric:tabular-nums}
.timer.running{background:var(--ink);color:var(--card)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:700}
.stepper span{min-width:44px;text-align:center;font-weight:700;font-size:14px}
.tinput{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:15px}
.tinput:focus,textarea:focus,select:focus,.sinput:focus{outline:2px solid var(--lang);outline-offset:-1px}
.lnk{font-size:12px;font-weight:700;color:var(--c);text-decoration:none;border:1px solid var(--line);padding:4px 8px;border-radius:8px;white-space:nowrap}
.bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--c);border-radius:99px}
.refl label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
.refl textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 11px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.refl textarea:last-child{margin-bottom:0}
.muted{color:var(--muted)}
h3{margin:0 0 4px;font-size:16px}
.small{font-size:13px;line-height:1.45}
/* week */
.wk{display:grid;grid-template-columns:minmax(120px,1fr) repeat(7,minmax(30px,40px));gap:4px 4px;align-items:center}
.wk .hd{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.25}
.wk .hd.today{color:var(--ink)}
.wk .nm{font-size:13px;font-weight:600;line-height:1.25;padding-right:6px;overflow:hidden;text-overflow:ellipsis}
.wk .nm small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.cell{width:30px;height:30px;border-radius:9px;border:0;margin:0 auto;display:grid;place-items:center;font-size:12px;font-weight:700;background:transparent;padding:0}
.cell.full{background:var(--c);color:#fff}
.cell.part{background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--ink)}
.cell.miss{background:var(--soft);color:var(--faint)}
.cell.open{border:2px dashed var(--line)}
.cell.off{color:var(--faint);cursor:default}
.wk .sep{grid-column:1/-1;height:1px;background:var(--line);margin:6px 0}
.wk .score{font-size:11.5px;font-weight:800;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
/* goals */
.gcard{border-left:4px solid var(--c)}
.gtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gpct{font-weight:800;font-size:20px;color:var(--c)}
.hlist{margin-top:12px;display:grid;gap:6px}
.hlist div{display:flex;justify-content:space-between;font-size:13px;gap:10px}
.words{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--soft);border-radius:8px;padding:4px 8px;font-size:13px}
/* settings */
.srow{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}
.srow:first-of-type{border-top:0}
.sline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sinput{flex:1;min-width:150px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px}
select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 8px;font-size:13.5px}
.days{display:flex;gap:4px}
.days button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700;color:var(--muted)}
.days button.on{background:var(--c);border-color:var(--c);color:#fff}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600}
.mini.install{background:var(--lang);border-color:var(--lang);color:#fff}
.mini.danger{color:#c23b2a}
.mini:disabled{opacity:.35;cursor:default}
.addbtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:11px;font-weight:700;color:var(--muted);margin-top:8px}
.num{width:64px}
.empty{text-align:center;color:var(--muted);padding:18px 0;font-size:14px}
</style>
</head>

/* ---------- state ---------- */
var SEED=null;
try{SEED=JSON.parse(document.getElementById("state").textContent)}catch(e){SEED=null}

function normalize(x){x.log=x.log||{};x.notes=x.notes||{};if(!x.start)x.start=todayKey();return x}
var S=normalize(JSON.parse(JSON.stringify(SEED)));

var mode="auth", user=null, ref=null, unsub=null, timer=null, saving=false, pendingRender=false, lastWritten=null, errMsg="";

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,"0")}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(k){var p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function todayKey(){return key(new Date())}
function dow(k){return parse(k).getDay()}
function fmt(k,o){return parse(k).toLocaleDateString("en-GB",o)}

/* ---------- logic ---------- */
function goalOf(h){for(var i=0;i<S.goals.length;i++)if(S.goals[i].id===h.goal)return S.goals[i];return S.goals[0]}
function color(area){return area==="sport"?"var(--sport)":area==="deen"?"var(--deen)":"var(--lang)"}
function scheduled(h,k){return h.days.indexOf(dow(k))>=0&&k>=(h.since||S.start)}
function val(h,k){return S.log[k]?S.log[k][h.id]:undefined}
function prog(h,k){
  var v=val(h,k);
  if(h.type==="count"||h.type==="minutes")return Math.min(1,(v||0)/(h.target||1));
  if(h.type==="text")return v&&String(v).trim()?1:0;
  return v?1:0;
}
function setVal(h,k,v){
  S.log[k]=S.log[k]||{};
  if(v===undefined||v===false||v===0||v===""){delete S.log[k][h.id];if(!Object.keys(S.log[k]).length)delete S.log[k]}
  else S.log[k][h.id]=v;

}
function streak(h){
  var t=todayKey(),k=prog(h,t)>=1?t:addDays(t,-1),s=0,guard=0;

    if(scheduled(h,k)){if(prog(h,k)>=1)s++;else break}
    k=addDays(k,-1);
  }
  return s;
}
function dayStats(k,list){
  var hs=(list||S.habits).filter(function(h){return scheduled(h,k)});
  var sum=0,full=0;hs.forEach(function(h){var p=prog(h,k);sum+=p;if(p>=1)full++});
  return {n:hs.length,sum:sum,full:full,pct:hs.length?Math.round(sum/hs.length*100):null};
}
function rangePct(from,to,list){
  var t=todayKey(),sum=0,n=0,k=from;
  while(k<=to&&k<=t){
    (list||S.habits).forEach(function(h){
      if(!scheduled(h,k))return;var p=prog(h,k);
      if(k===t&&p===0)return; /* don't count today against you yet */
      sum+=p;n++;

    k=addDays(k,1);
  }
  return n?Math.round(sum/n*100):null;
}
function goalHabits(g){return S.habits.filter(function(h){return h.goal===g.id})}
function drift(g){
  var hs=goalHabits(g);if(!hs.length)return 0;
  var t=todayKey();
  if(hs.some(function(h){return scheduled(h,t)&&prog(h,t)>0}))return 0;
  var k=addDays(t,-1),missed=0,steps=0;

    var sh=hs.filter(function(h){return scheduled(h,k)});
    if(sh.length){if(sh.some(function(h){return prog(h,k)>0}))break;missed++}
    k=addDays(k,-1);
  }
  return missed>=3?missed:0;
}

/* ---------- saving ---------- */
function typing(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")}
function save(){
  if(mode!=="live")return;
  clearTimeout(timer);timer=setTimeout(writeNow,700);
  setStatus();
}
function writeNow(){
  clearTimeout(timer);timer=null;
  if(!ref)return;
  saving=true;setStatus();
  lastWritten=JSON.stringify(S);
  setDoc(ref,{state:lastWritten,updatedAt:Date.now()}).then(function(){saving=false;setStatus()},function(e){
    saving=false;var st=document.getElementById("status");if(st){st.textContent="Not saved: "+(e.code||e.message);st.className="status warn"}
  });
}

  var st=document.getElementById("status");if(!st)return;
  st.textContent=saving||timer?"Saving\u2026":"Saved";st.className="status";
}

/* ---------- dom helpers ---------- */
function el(tag,attrs){
  var e=document.createElement(tag);attrs=attrs||{};
  for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="html")e.innerHTML=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else if(k==="value")e.value=v;
    else e.setAttribute(k,v===true?"":v)}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
